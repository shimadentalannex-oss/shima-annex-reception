<!doctype html><html lang='ja'><head>
<meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'>
<title>SHIMA DENTAL ANNEX Reception</title>
<link rel='stylesheet' href='style.css'>
</head><body>
<div class='card'>
<h1>SHIMA DENTAL ANNEX</h1>
<label>患者名</label><input id='name'>
<label>商品</label>
<select id='item'></select>
<label>数量</label><input id='qty' type='number' value='1' min='1'>
<label>支払方法</label>
<select id='pay'><option>カード</option><option>現金</option></select>
<h2>合計 <span id='total'></span> 円</h2>
<button onclick='calc()'>計算</button>
<button onclick='receipt()'>領収書プレビュー</button>
<pre id='out'></pre>
</div>
<script src='app.js'></script>
</body></html>
