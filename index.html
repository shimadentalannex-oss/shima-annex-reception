                商品を選択してください

            <span>

                合計金額

            </span>

            <span id="totalPrice">

            </span>

        </div>

    </section>



    <!-- 支払方法 -->

    <section class="card">

        <h2>

            お支払い方法

        </h2>

        <div class="payment-area">

            <button
                id="cardBtn"
                class="payment-button active"
                onclick="selectPayment('カード')">

                💳 カード

            </button>

            <button
                id="cashBtn"
                class="payment-button"
                onclick="selectPayment('現金')">

                💴 現金

            </button>

        </div>

    </section>



    <!-- 操作 -->

    <section class="card">

        <div class="button-area">

            <button
                class="print-button"
                onclick="printReceipt()">

                🖨 印刷

            </button>

            <button
                class="clear-button"
                onclick="clearCart()">

                🗑 クリア

            </button>
            
            <button
               class="history-button"
               onclick="showHistory()">

                 📋 履歴

　　　　　　　　</button>

              onclick="showSalesSummary()">
