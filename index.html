<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SHIMA DENTAL ANNEX
受付システム
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <img
            src="logo.png"
            class="logo"
            alt="ANNEX Logo">

        <div class="header-text">

            <h1>
                SHIMA DENTAL ANNEX
            </h1>

            <p>
                Reception System
            </p>

        </div>

    </header>



    <!-- 患者情報 -->

    <section class="card">

        <h2>

            患者情報

        </h2>

        <label>

            お名前

        </label>

        <input

            id="patientName"

            type="text"

            placeholder="患者様のお名前を入力">

    </section>



    <!-- メニュー -->

    <section class="card">

        <h2>

            処置メニュー

        </h2>

        <div class="menu-grid">

            <button

                class="menu-button"

                onclick="addItem('オフィスホワイトニング',33000)">

                <span class="menu-name">

                    オフィスホワイトニング

                </span>

                <span class="menu-price">

                    ¥33,000

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホームホワイトニング',27500)">

                <span class="menu-name">

                    ホームホワイトニング

                </span>

                <span class="menu-price">

                    ¥27,500

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホーム薬液追加',5500)">

                <span class="menu-name">

                    ホーム薬液追加

                </span>

                <span class="menu-price">

                    ¥5,500

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホーム薬液ウィズ差額',1100)">

                <span class="menu-name">

                    ホーム薬液ウィズ差額

                </span>

                <span class="menu-price">

                    ¥1,100

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('デュアルホワイトニング',55000)">

                <span class="menu-name">

                    デュアルホワイトニング

                </span>

                <span class="menu-price">

                    ¥55,000

                </span>

            </button>            <button
                class="menu-button"
                onclick="addItem('プロフェッショナルクリーニング',13200)">

                <span class="menu-name">
                    プロフェッショナルクリーニング
                </span>

                <span class="menu-price">
                    ¥13,200
                </span>

            </button>

            <button
                class="menu-button"
                onclick="addItem('デンタルエステ',16500)">

                <span class="menu-name">
                    デンタルエステ
                </span>

                <span class="menu-price">
                    ¥16,500
                </span>

            </button>

            <button
                class="menu-button"
                onclick="addItem('ルシェロホワイト歯磨き粉',1900)">

                <span class="menu-name">
                    ルシェロホワイト歯磨き粉
                </span>

                <span class="menu-price">
                    ¥1,900
                </span>

            </button>

            <button
                class="menu-button"
                onclick="addItem('ルシェロホワイト歯ブラシ',380)">

                <span class="menu-name">
                    ルシェロホワイト歯ブラシ
                </span>

                <span class="menu-price">
                    ¥380
                </span>

            </button>

        </div>

    </section>



    <!-- 会計内容 -->

    <section class="card">

        <h2>

            会計内容

        </h2>

        <div id="cartItems">

            <div class="empty">

                商品を選択してください

            </div>

        </div>

        <div class="total-row">

            <span>

                合計金額

            </span>

            <span id="totalPrice">

                ¥0

            </span>

        </div>

    </section>



    <!-- 支払方法 -->

    <section class="card">

        <h2>

            お支払い方法

        </h2>

        <div class="payment-area">

            <button
                id="cardBtn"
                class="payment-button active"
                onclick="selectPayment('カード')">

                💳 カード

            </button>

            <button
                id="cashBtn"
                class="payment-button"
                onclick="selectPayment('現金')">

                💴 現金

            </button>

        </div>

    </section>



    <!-- 操作 -->

    <section class="card">

        <div class="button-area">

            <button
                class="preview-button"
                onclick="previewReceipt()">

                👀 プレビュー

            </button>

            <button
                class="print-button"
                onclick="printReceipt()">

                🖨 印刷

            </button>

            <button
                class="clear-button"
                onclick="clearCart()">

                🗑 クリア

            </button>

        </div>

    </section>    <!-- ===== 領収書（印刷用）===== -->

    <section id="receiptArea" class="receipt">

        <div class="receipt-header">

            <h2>

                領　収　書

            </h2>

        </div>

        <div class="receipt-patient">

            <span id="receiptPatient">

                患者名

            </span>

        </div>

        <table class="receipt-table">

            <thead>

                <tr>

                    <th>

                        内容

                    </th>

                    <th>

                        金額

                    </th>

                </tr>

            </thead>

            <tbody id="receiptItems">

            </tbody>

        </table>

        <div class="receipt-total">

            <span>

                合計

            </span>

            <span id="receiptTotal">

                ¥0

            </span>

        </div>

        <div class="receipt-footer">

            <div>

                発行日：

                <span id="today">

                </span>

            </div>

            <div>

                お支払い：

                <span id="receiptPayment">

                    カード

                </span>

            </div>

        </div>

        <div class="clinic-info">

            <strong>

                SHIMA DENTAL ANNEX

            </strong>

            <br>

            〒930-0066

            <br>

            富山市千石町3-6-16

            <br>

            TEL：076-456-2061

        </div>

        <div class="stamp-area">

            <img
                src="inkan.png"
                class="stamp-image"
                alt="印鑑">

        </div>

    </section>

</div>

<script src="app.js"></script>

</body>

</html>
