<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
SHIMA DENTAL ANNEX
受付システム
</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="container">

    <!-- Header -->

    <header class="header">

        <img
            src="logo.png"
            class="logo"
            alt="ANNEX Logo">

        <div class="header-text">

            <h1>
                SHIMA DENTAL ANNEX
            </h1>

            <p>
                Reception System
            </p>

        </div>

    </header>



    <!-- 患者情報 -->

    <section class="card">

        <h2>

            患者情報

        </h2>

        <label>

            お名前

        </label>

        <input

            id="patientName"

            type="text"

            placeholder="患者様のお名前を入力">

    </section>



    <!-- メニュー -->

    <section class="card">

        <h2>

            処置メニュー

        </h2>

        <div class="menu-grid">

            <button

                class="menu-button"

                onclick="addItem('オフィスホワイトニング',33000)">

                <span class="menu-name">

                    オフィスホワイトニング

                </span>

                <span class="menu-price">

                    ¥33,000

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホームホワイトニング',27500)">

                <span class="menu-name">

                    ホームホワイトニング

                </span>

                <span class="menu-price">

                    ¥27,500

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホーム薬液追加',5500)">

                <span class="menu-name">

                    ホーム薬液追加

                </span>

                <span class="menu-price">

                    ¥5,500

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('ホーム薬液ウィズ差額',1100)">

                <span class="menu-name">

                    ホーム薬液ウィズ差額

                </span>

                <span class="menu-price">

                    ¥1,100

                </span>

            </button>



            <button

                class="menu-button"

                onclick="addItem('デュアルホワイトニング',55000)">

                <span class="menu-name">

                    デュアルホワイトニング

                </span>

                <span class="menu-price">

                    ¥55,000

                </span>

            </button>
